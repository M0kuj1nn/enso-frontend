      <circle cx="115" cy="125" r="1.5" fill="white" />
      <circle cx="120" cy="125" r="1.5" fill="white" />
      <circle cx="125" cy="125" r="1.5" fill="white" />
      {/* Planet */}
      <circle cx="80" cy="75" r="12" fill="none" stroke="white" strokeWidth="1.5" />
      <ellipse cx="80" cy="75" rx="20" ry="6" fill="none" stroke="white" strokeWidth="1.5" transform="rotate(-20 80 75)" />
      {/* Heart */}
      <path d="M60 135a5 5 0 010-10 5 5 0 015 5 5 5 0 015-5 5 5 0 010 10l-5 5z" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
