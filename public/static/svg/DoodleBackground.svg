  <svg className="absolute inset-0 w-full h-full opacity-[0.04] pointer-events-none" xmlns="http://www.w3.org/2000/svg">
    <pattern id="doodle" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
