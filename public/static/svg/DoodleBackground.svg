      <path d="M130 45l5-5" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" />
      {/* Star */}
      <path d="M30 110l5-15 5 15 15 5-15 5-5 15-5-15-15-5z" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
